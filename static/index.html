<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WoW AH Alert — Item 271445</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --border: #2d3a4d;
      --text: #e8edf4;
      --muted: #8b9cb3;
      --gold: #ffd100;
      --green: #4ade80;
      --red: #f87171;
      --accent: #3b82f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 1.25rem;
      max-width: 720px;
      margin: 0 auto;
    }
    header { margin-bottom: 1.25rem; }
    h1 { font-size: 1.25rem; font-weight: 600; }
    .sub { color: var(--muted); font-size: 0.85rem; margin-top: 0.25rem; }
    .status-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }
    .pill {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 0.35rem 0.65rem;
      border-radius: 999px;
      background: var(--panel);
      border: 1px solid var(--border);
    }
    .pill.scanning { color: var(--accent); border-color: var(--accent); }
    .pill.waiting { color: var(--muted); }
    .pill.error { color: var(--red); border-color: var(--red); }
    .pill.alert { color: var(--gold); border-color: var(--gold); animation: pulse 1s infinite; }
    @keyframes pulse { 50% { opacity: 0.7; } }
    .progress-wrap {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      margin-bottom: 1rem;
    }
    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }
    .progress-bar {
      height: 8px;
      background: var(--bg);
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #60a5fa);
      width: 0%;
      transition: width 0.2s ease;
    }
    .realm { font-size: 0.85rem; margin-top: 0.5rem; color: var(--text); }
    section {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 1rem;
      overflow: hidden;
    }
    section h2 {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      padding: 0.6rem 1rem;
      border-bottom: 1px solid var(--border);
    }
    .alerts { padding: 0.75rem 1rem; min-height: 3rem; }
    .alert-card {
      background: rgba(255, 209, 0, 0.08);
      border: 1px solid var(--gold);
      border-radius: 6px;
      padding: 0.75rem;
      margin-bottom: 0.5rem;
    }
    .alert-card:last-child { margin-bottom: 0; }
    .alert-card .price { color: var(--gold); font-size: 1.1rem; font-weight: 700; }
    .alert-card a { color: var(--accent); font-size: 0.8rem; }
    .empty { color: var(--muted); font-size: 0.85rem; }
    .log {
      max-height: 220px;
      overflow-y: auto;
      padding: 0.5rem 1rem;
      font-family: Consolas, monospace;
      font-size: 0.75rem;
      line-height: 1.5;
    }
    .log div { padding: 0.1rem 0; }
    .log .match { color: var(--gold); }
    .log .alert { color: var(--green); font-weight: 600; }
    .log .error { color: var(--red); }
    .notify-btn {
      margin-top: 0.5rem;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .notify-btn:hover { border-color: var(--accent); }
    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      padding: 1rem;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }
    .form-group label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
    }
    .form-group input,
    .form-group select {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.4rem 0.6rem;
      border-radius: 4px;
      font-size: 0.85rem;
      font-family: inherit;
    }
    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.1);
    }
    .form-group input[type="checkbox"] {
      width: 1.1rem;
      height: 1.1rem;
      margin-top: 0.25rem;
      cursor: pointer;
    }
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .checkbox-group label {
      margin: 0;
      text-transform: none;
      letter-spacing: normal;
      color: var(--text);
    }
    .stats-group {
      grid-column: 1 / -1;
    }
    .stat-options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      margin-top: 0.5rem;
    }
    .stat-checkbox {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .stat-checkbox input {
      width: 1rem;
      height: 1rem;
      margin: 0;
    }
    .stat-checkbox:has(input:checked) {
      background: rgba(59, 130, 246, 0.1);
      border-color: var(--accent);
    }
    .button-group {
      grid-column: 1 / -1;
      display: flex;
      gap: 0.5rem;
      justify-content: flex-end;
    }
    .btn {
      padding: 0.5rem 1rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .btn-primary {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .btn-primary:hover {
      opacity: 0.9;
    }
    .btn-secondary {
      background: var(--panel);
      color: var(--text);
    }
    .btn-secondary:hover {
      border-color: var(--accent);
    }
    .settings-toggle {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .settings-toggle:hover { border-color: var(--accent); }
    #settings-section { display: none; }
  </style>
</head>
<body>
  <header>
    <h1>Item 271445 — EU AH Monitor</h1>
    <p class="sub" id="filters">Loading...</p>
  </header>

  <div class="status-row">
    <span class="pill waiting" id="status-pill">Starting</span>
    <span class="sub" id="status-msg">Connecting...</span>
    <button class="settings-toggle" onclick="toggleSettings()">⚙ Settings</button>
  </div>

  <div class="progress-wrap">
    <div class="progress-label">
      <span id="scan-label">Scan —</span>
      <span id="progress-text">0 / 0</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="realm" id="current-realm">—</div>
  </div>

  <section>
    <h2>Alerts</h2>
    <div class="alerts" id="alerts">
      <p class="empty">No matches yet — you'll get a popup when one appears.</p>
    </div>
    <button class="notify-btn" id="notify-btn" hidden>Enable browser notifications</button>
  </section>

  <section id="settings-section">
    <h2>Search Settings</h2>
    <div class="settings-grid">
      <div class="form-group">
        <label>Item ID</label>
        <input type="number" id="item-id" min="1" placeholder="e.g. 271445">
      </div>

      <div class="form-group">
        <label>Max Price (gold)</label>
        <input type="number" id="max-price" min="0" placeholder="e.g. 600000">
      </div>

      <div class="form-group">
        <label>Difficulty</label>
        <select id="difficulty">
          <option value="0">LFR</option>
          <option value="1">Normal</option>
          <option value="2" selected>Heroic</option>
          <option value="3">Mythic</option>
        </select>
      </div>

      <div class="form-group checkbox-group">
        <input type="checkbox" id="must-socket" checked>
        <label for="must-socket">Requires Socket</label>
      </div>

      <div class="form-group stats-group">
        <label>Accepted Stats (at least 2)</label>
        <div class="stat-options">
          <label class="stat-checkbox">
            <input type="checkbox" name="stat" value="crit" checked> Crit
          </label>
          <label class="stat-checkbox">
            <input type="checkbox" name="stat" value="haste" checked> Haste
          </label>
          <label class="stat-checkbox">
            <input type="checkbox" name="stat" value="mastery" checked> Mastery
          </label>
          <label class="stat-checkbox">
            <input type="checkbox" name="stat" value="vers"> Versatility
          </label>
        </div>
      </div>

      <div class="button-group">
        <button class="btn btn-secondary" onclick="resetSettings()">Reset</button>
        <button class="btn btn-primary" onclick="applySettings()">Apply</button>
      </div>
    </div>
  </section>

  <section>
    <h2>Live log</h2>
    <div class="log" id="log"></div>
  </section>

  <script>
    const $ = (id) => document.getElementById(id);
    let notifiedKeys = new Set();
    let currentConfig = {};

    function formatStats(sets) {
      return sets.map((set) => set.map((id) => ["Crit", "Haste", "Mastery", "Versatility"][id]).join("/"))
        .join(" · ");
    }

    function toggleSettings() {
      const section = $("settings-section");
      section.style.display = section.style.display === "none" ? "block" : "none";
      if (section.style.display === "block") {
        loadSettingsForm();
      }
    }

    function loadSettingsForm() {
      $("item-id").value = currentConfig.item_id || 271445;
      $("max-price").value = currentConfig.max_buyout_gold || 600000;
      $("difficulty").value = currentConfig.difficulty || 2;
      $("must-socket").checked = currentConfig.must_have_socket !== false;

      // Clear and reset stat checkboxes
      document.querySelectorAll('input[name="stat"]').forEach(box => {
        box.checked = false;
      });

      // Mark selected stats
      const selectedStats = (currentConfig.accepted_secondary_sets || []).flat();
      const statMap = {0: "crit", 1: "haste", 2: "mastery", 3: "vers"};
      selectedStats.forEach(id => {
        const stat = statMap[id];
        if (stat) {
          const box = document.querySelector(`input[name="stat"][value="${stat}"]`);
          if (box) box.checked = true;
        }
      });
    }

    async function applySettings() {
      const itemId = parseInt($("item-id").value);
      const maxPrice = parseInt($("max-price").value);
      const difficulty = parseInt($("difficulty").value);
      const mustSocket = $("must-socket").checked;

      const selectedStats = Array.from(document.querySelectorAll('input[name="stat"]:checked'))
        .map(box => box.value);

      if (!itemId) {
        alert("Item ID is required");
        return;
      }

      if (selectedStats.length === 0) {
        alert("Please select at least one stat");
        return;
      }

      try {
        const res = await fetch("/api/settings", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            item_id: itemId,
            max_buyout_gold: maxPrice,
            difficulty: difficulty,
            must_have_socket: mustSocket,
            accepted_secondary_sets: selectedStats,
          }),
        });

        if (!res.ok) {
          const err = await res.text();
          alert(`Error: ${err}`);
          return;
        }

        alert("Settings applied! The app will use these filters on the next scan.");
        toggleSettings();
        // Reload config to reflect changes
        await loadConfig();
      } catch (err) {
        alert(`Error applying settings: ${err.message}`);
      }
    }

    function resetSettings() {
      if (confirm("Reset to defaults (Item 271445, 600k, Heroic, Socket required, Crit/Haste/Mastery)?")) {
        loadSettingsForm();
      }
    }

    async function loadConfig() {
      const cfg = await fetch("/api/config").then((r) => r.json());
      currentConfig = cfg;
      const title = `WoW AH Alert — Item ${cfg.item_id}`;
      document.title = title;
      $("filters").textContent =
        `Item ${cfg.item_id} · ≤ ${cfg.max_buyout_gold.toLocaleString()}g · ${cfg.difficulty_label} · ${cfg.must_have_socket ? "Socket" : "No socket"} · ${formatStats(cfg.accepted_secondary_sets)} · every ${cfg.poll_interval_seconds / 60} min`;
      $("status-msg").textContent = cfg.filter_summary;
      $("alerts").innerHTML = '<p class="empty">No matches yet — you\'ll get a popup when one appears.</p>';
      const header = document.querySelector("header h1");
      if (header) header.textContent = title + " — EU AH Monitor";
    }

    let alerts = [];

    function renderAlerts(list) {
      alerts = list.length ? list : alerts;
      const el = $("alerts");
      if (!alerts.length) {
        el.innerHTML = '<p class="empty">No matches yet — you\'ll get a popup when one appears.</p>';
        return;
      }
      el.innerHTML = alerts.map((a) => `
        <div class="alert-card">
          <div class="price">${a.buyout_gold.toLocaleString()}g</div>
          <div>${a.realm_names}</div>
          <div style="color:var(--muted);font-size:0.8rem;margin:0.25rem 0">${a.secondaries}</div>
          <a href="${a.wowhead_url}" target="_blank" rel="noopener">Wowhead ↗</a>
        </div>
      `).join("");
    }

    function appendLog(entry) {
      const log = $("log");
      const div = document.createElement("div");
      div.className = entry.level || "info";
      div.textContent = entry.text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
      while (log.children.length > 300) log.removeChild(log.firstChild);
    }

    function setStatus(status, message) {
      const pill = $("status-pill");
      pill.textContent = status;
      pill.className = "pill " + (status === "scanning" || status === "caching" ? "scanning"
        : status === "error" ? "error"
        : message && message.includes("new listing") ? "alert"
        : "waiting");
      $("status-msg").textContent = message || "";
    }

    function applySnapshot(data) {
      setStatus(data.status, data.message);
      $("scan-label").textContent = data.scan_number ? `Scan #${data.scan_number}` : "Scan";
      $("progress-text").textContent = `${data.realm_index} / ${data.realm_total || "—"}`;
      const pct = data.realm_total ? (data.realm_index / data.realm_total) * 100 : 0;
      $("progress-fill").style.width = pct + "%";
      $("current-realm").textContent = data.current_realm || (data.status === "waiting" && data.next_scan_at
        ? `Next scan ${new Date(data.next_scan_at * 1000).toLocaleTimeString()}`
        : "—");
      renderAlerts(data.new_alerts.length ? data.new_alerts : data.matches);
      (data.new_alerts || []).forEach(maybeNotify);
    }

    function maybeNotify(alert) {
      if (!("Notification" in window) || Notification.permission !== "granted") return;
      const key = `${alert.connected_realm_id}:${alert.auction_id}`;
      if (notifiedKeys.has(key)) return;
      notifiedKeys.add(key);
      new Notification(`Item found — ${alert.buyout_gold.toLocaleString()}g!`, {
        body: `${alert.realm_names}\n${alert.secondaries}`,
        requireInteraction: true,
      });
      try {
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = 880;
        gain.gain.value = 0.15;
        osc.start();
        osc.stop(ctx.currentTime + 0.25);
      } catch (error) {
        // Browser audio can be blocked until the page receives a user gesture.
      }
    }

    $("notify-btn").onclick = async () => {
      const perm = await Notification.requestPermission();
      $("notify-btn").hidden = perm === "granted";
    };

    if ("Notification" in window && Notification.permission === "default") {
      $("notify-btn").hidden = false;
    }

    loadConfig();

    const es = new EventSource("/api/events");
    es.onmessage = (e) => {
      const event = JSON.parse(e.data);
      if (event.type === "snapshot") {
        applySnapshot(event.data);
      } else if (event.type === "log") {
        appendLog({ level: event.level, text: event.text });
      } else if (event.type === "alert") {
        maybeNotify(event.alert);
        renderAlerts([event.alert, ...alerts]);
      }
    };
    es.onerror = () => {
      setStatus("error", "Connection lost — refresh page");
    };

    fetch("/api/state").then((r) => r.json()).then(applySnapshot);
  </script>
</body>
</html>
